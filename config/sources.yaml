# Configuration for 5 Authorized Original News Publishers
# Definition: Each source represents an authentic publisher identity, not an alias or endpoint.

sources:
  - publisher_id: "reuters"
    display_name: "Reuters Financial News"
    provider_id: "reuters_direct_feed"
    endpoint_type: "push_websocket"
    auth_reference: "LIC-REUTERS-ENT-2026-0881"
    attribution_url: "https://www.reuters.com/markets"
    allowed_fields: ["article_id", "headline", "tickers", "published_at", "article_url"]
    allowed_historical_lookback_days: 180
    timestamp_semantics: "publisher_confirmed"
    target_weight: 0.25
    rate_limit_per_min: 120
    is_active: true
    storage_permitted: true

