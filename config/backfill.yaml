# Configuration for Three-Month Historical Backfill and 50,000 Record Export

historical_window:
  start_date: "2026-08-01T00:00:00Z"
  end_date: "2026-11-01T00:00:00Z"
  timezone: "UTC"
  span_description: "Three full calendar months (August, September, October 2026)"

export_target:
  exact_count: 50000
  output_parquet: "data/history_scored_50k.parquet"
  raw_archive_dir: "data/raw_archive"
  manifest_path: "artifacts/data/history_manifest.json"
  quality_report_path: "artifacts/data/quality_report.json"

sampling_distribution:
  reuters: 0.25      # 12,500 records
  bloomberg: 0.25    # 12,500 records
  cnbc: 0.20         # 10,000 records
  marketwatch: 0.15  # 7,500 records
  wsj: 0.15          # 7,500 records

batch_inference:
  batch_size: 64
  max_length: 128
  model_id: "ProsusAI/finbert"
  device: "cuda"  # auto falls back to cpu if cuda unavailable
  use_redis_cache: true

quality_filters:
  min_headline_chars: 10
  max_headline_chars: 300
  allowed_languages: ["en"]
  require_valid_timestamp: true

